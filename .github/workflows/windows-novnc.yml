name: Windows Web Desktop (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration in minutes (1-330)'
        required: true
        default: '300'
        type: string

permissions: {}

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 1. Validate Settings and Set Windows Password
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Classic VNC authentication only uses eight password bytes.
          if ($Env:VNC_PASSWORD -cnotmatch '^[A-Za-z0-9]{8}$') {
              throw 'Set VNC_PASSWORD to exactly 8 random ASCII letters/digits. Do not reuse another password.'
          }
          if ([string]::IsNullOrWhiteSpace($Env:RDP_PASSWORD)) {
              throw 'Set RDP_PASSWORD to a strong Windows login password.'
          }
          if ($Env:DURATION_MINUTES -notmatch '^[1-9][0-9]{0,2}$' -or [int]$Env:DURATION_MINUTES -gt 330) {
              throw 'duration_minutes must be an integer from 1 to 330.'
          }
          $password = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $password
          $root = Join-Path $Env:RUNNER_TEMP 'web-desktop'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "WEB_DESKTOP_ROOT=$root" >> $Env:GITHUB_ENV

      - name: Install NetEase UU Remote
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $Env:WEB_DESKTOP_ROOT 'uu-remote-setup.exe'
          # Pinned official download and SHA256 from the NetEase.UURemote winget manifest.
          Invoke-WebRequest 'https://a56.gdl.netease.com/UURemote_Setup_4.47.0.5146_1112133553_gwqd.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'FB2D24A40A51AE82701AE2D145DB387DF4FB63F8BAD2D020DB4AFCCDA928195E') {
              throw 'UU Remote installer SHA256 verification failed.'
          }
          $setup = Start-Process $installer -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(300000)) {
              Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
              throw 'UU Remote silent installation timed out.'
          }
          if ($setup.ExitCode -ne 0) { throw "UU Remote installation failed: $($setup.ExitCode)" }
          $uninstallKeys = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $installed = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
              Where-Object { $_.PSChildName -eq 'GameViewer' -or $_.DisplayName -match 'UU.*远程|UU.*Remote|GameViewer' } |
              Select-Object -First 1
          if (-not $installed) { throw 'UU Remote installer exited, but its installation registration was not found.' }
          Write-Host "Installed: $($installed.DisplayName) $($installed.DisplayVersion)"
          '### UU Remote: installed. Open it from the Windows Start menu and complete login/authorization manually.' >> $Env:GITHUB_STEP_SUMMARY

      - name: Install Chinese Input Support (Microsoft Pinyin)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          try {
              $capabilityName = 'Language.Basic~~~zh-CN~0.0.1.0'
              $capability = Get-WindowsCapability -Online -Name $capabilityName
              if (-not $capability) { throw 'Chinese Basic language capability is unavailable on this Windows Server image.' }
              if ($capability.State -ne 'Installed') {
                  $result = Add-WindowsCapability -Online -Name $capabilityName
                  if ($result.RestartNeeded) {
                      Write-Warning 'Windows reports that language components need a restart. This workflow will not reboot the Runner.'
                  }
              }
              if ((Get-WindowsCapability -Online -Name $capabilityName).State -ne 'Installed') {
                  throw 'Chinese Basic language capability was not installed.'
              }
              $languages = Get-WinUserLanguageList
              if ('zh-CN' -notin $languages.LanguageTag) { $languages.Add('zh-CN') }
              $chinese = $languages | Where-Object LanguageTag -eq 'zh-CN' | Select-Object -First 1
              $pinyin = '0804:{81D4E9C9-1D3B-41BC-9E6C-4B40BF79E35E}{FA550B04-5AD7-411F-A5AC-CA038EC515D7}'
              if ($pinyin -notin $chinese.InputMethodTips) { $chinese.InputMethodTips.Add($pinyin) }
              Set-WinUserLanguageList $languages -Force
              Start-Process "$Env:WINDIR\System32\ctfmon.exe"
              Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips | Format-List
              '### Chinese input: Microsoft Pinyin configured for runneradmin. Use Win+Space to select Chinese, then Shift to toggle Chinese/English. A new login may be needed; do not reboot the Runner.' >> $Env:GITHUB_STEP_SUMMARY
          } catch {
              '### Chinese input: installation/configuration FAILED. Check the Chinese input step log; Windows Server language component downloads may be unavailable. The remote desktop will still start.' >> $Env:GITHUB_STEP_SUMMARY
              Write-Warning $_.Exception.Message
              throw
          }

      - name: 2. Install TightVNC Service
        timeout-minutes: 5
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-NetTCPConnection -LocalPort 5900, 16080 -State Listen -ErrorAction SilentlyContinue) {
              throw 'A required port is already occupied.'
          }
          $installer = Join-Path $Env:WEB_DESKTOP_ROOT 'tightvnc.msi'
          Invoke-WebRequest 'https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi' -OutFile $installer
          $arguments = @(
              '/i', "`"$installer`"", '/qn', '/norestart', 'ADDLOCAL=Server',
              'SERVER_REGISTER_AS_SERVICE=1', 'SERVER_ADD_FIREWALL_EXCEPTION=0', 'SERVER_ALLOW_SAS=1',
              'SET_ALLOWLOOPBACK=1', 'VALUE_OF_ALLOWLOOPBACK=1',
              'SET_LOOPBACKONLY=1', 'VALUE_OF_LOOPBACKONLY=1',
              'SET_ACCEPTHTTPCONNECTIONS=1', 'VALUE_OF_ACCEPTHTTPCONNECTIONS=0',
              'SET_USEVNCAUTHENTICATION=1', 'VALUE_OF_USEVNCAUTHENTICATION=1',
              'SET_PASSWORD=1', "VALUE_OF_PASSWORD=$Env:VNC_PASSWORD",
              'SET_VIEWONLYPASSWORD=1', "VALUE_OF_VIEWONLYPASSWORD=$Env:VNC_PASSWORD"
          )
          $setup = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -notin @(0, 3010)) {
              throw "TightVNC installation failed: $($setup.ExitCode)"
          }
          $config = Get-ItemProperty 'HKLM:\SOFTWARE\TightVNC\Server'
          if ($config.LoopbackOnly -ne 1 -or $config.AllowLoopback -ne 1 -or $config.UseVncAuthentication -ne 1) {
              throw 'TightVNC loopback/authentication configuration did not apply.'
          }
          Start-Service tvnserver
          (Get-Service tvnserver).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))

      - name: 3. Install noVNC, WebSocket Proxy and cloudflared
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $Env:WEB_DESKTOP_ROOT
          python -m venv "$root\venv"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Python environment.' }
          $python = "$root\venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check 'websockify==0.13.0' 'pycryptodome==3.23.0'
          if ($LASTEXITCODE -ne 0) { throw 'Python package installation failed.' }
          Invoke-WebRequest 'https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip' -OutFile "$root\novnc.zip"
          Expand-Archive "$root\novnc.zip" -DestinationPath $root
          if (-not (Test-Path "$root\noVNC-1.6.0\vnc.html")) { throw 'noVNC files missing.' }
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-windows-amd64.exe' -OutFile "$root\cloudflared.exe"
          if ((Get-FileHash "$root\cloudflared.exe" -Algorithm SHA256).Hash -ne 'd5c1d82031da6253dcdcff64c944cd0fe063016edeb2e4fd088075fc9bd52d0a') {
              throw 'cloudflared SHA256 verification failed.'
          }

      - name: 4. Verify VNC Authentication and Start Web Proxy
        timeout-minutes: 3
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $Env:WEB_DESKTOP_ROOT
          $python = "$root\venv\Scripts\python.exe"
          @'
          import os, socket, struct, time
          from Crypto.Cipher import DES

          def read_exact(sock, length):
              result = b""
              while len(result) < length:
                  data = sock.recv(length - len(result))
                  if not data:
                      raise RuntimeError("VNC closed the connection")
                  result += data
              return result

          def authenticate(password):
              with socket.create_connection(("127.0.0.1", 5900), timeout=10) as sock:
                  banner = read_exact(sock, 12)
                  if banner != b"RFB 003.008\n":
                      raise RuntimeError("Expected RFB 3.8; refusing to skip authentication checks")
                  sock.sendall(b"RFB 003.008\n")
                  count = read_exact(sock, 1)[0]
                  if count == 0:
                      raise RuntimeError("VNC rejected negotiation")
                  security = read_exact(sock, count)
                  if 1 in security or 2 not in security:
                      raise RuntimeError("Server must require VNC password authentication")
                  sock.sendall(b"\x02")
                  challenge = read_exact(sock, 16)
                  key = bytes(int(f"{b:08b}"[::-1], 2) for b in password.encode("ascii"))
                  sock.sendall(DES.new(key, DES.MODE_ECB).encrypt(challenge))
                  return struct.unpack("!I", read_exact(sock, 4))[0]

          password = os.environ["VNC_PASSWORD"]
          for attempt in range(20):
              try:
                  with socket.create_connection(("127.0.0.1", 5900), timeout=2):
                      break
              except OSError:
                  time.sleep(1)
          if authenticate(password) != 0:
              raise RuntimeError("Configured VNC password was rejected")
          wrong = ("A" if password[0] != "A" else "B") + password[1:]
          if authenticate(wrong) == 0:
              raise RuntimeError("VNC accepted an incorrect password")
          print("VNC authentication checks passed: password required, correct accepted, incorrect rejected.")
          '@ | Set-Content "$root\check-vnc.py" -Encoding utf8
          & $python "$root\check-vnc.py"
          if ($LASTEXITCODE -ne 0) { throw 'VNC authentication validation failed; tunnel will not start.' }
          Remove-Item Env:VNC_PASSWORD
          @'
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $proxy = Start-Process "$root\venv\Scripts\python.exe" -ArgumentList @(
              '-m', 'websockify', '--web', "`"$root\noVNC-1.6.0`"", '127.0.0.1:16080', '127.0.0.1:5900'
          ) -RedirectStandardOutput "$root\proxy.out.log" -RedirectStandardError "$root\proxy.err.log" -PassThru
          $proxy.Id | Set-Content "$root\proxy.pid"
          $proxy.WaitForExit()
          "Proxy exited at $(Get-Date -Format o), code $($proxy.ExitCode)" | Add-Content "$root\proxy.err.log"
          exit 1
          '@ | Set-Content "$root\run-proxy.ps1" -Encoding utf8
          $action = New-ScheduledTaskAction -Execute (Get-Command pwsh.exe).Source -Argument "-NoProfile -NonInteractive -File `"$root\run-proxy.ps1`"" -WorkingDirectory $root
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 6)
          Register-ScheduledTask -TaskName 'WebDesktopProxy' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName 'WebDesktopProxy'
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$root\proxy.pid"); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path "$root\proxy.pid")) { throw 'Scheduled proxy did not start; see task diagnostics.' }
          $proxy = Get-Process -Id ([int](Get-Content "$root\proxy.pid"))
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
              $proxy.Refresh()
              if ($proxy.HasExited) { throw 'WebSocket proxy exited. See proxy diagnostic step.' }
              try {
                  $response = Invoke-WebRequest 'http://127.0.0.1:16080/vnc.html' -TimeoutSec 3
                  if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'noVNC HTTP server did not become ready.' }
          $listeners = @(Get-NetTCPConnection -LocalPort 16080 -State Listen)
          Write-Host "Proxy launcher PID: $($proxy.Id); listener count: $($listeners.Count)"
          foreach ($listener in $listeners) {
              Write-Host "Listener: $($listener.LocalAddress):$($listener.LocalPort), PID $($listener.OwningProcess)"
          }
          if ($listeners.Count -ne 1 -or $listeners[0].LocalAddress -ne '127.0.0.1') {
              throw 'noVNC must listen only on 127.0.0.1:16080; refusing to open the tunnel.'
          }

          # Windows venv python.exe can launch the base interpreter as a child.
          $listenerId = [int]$listeners[0].OwningProcess
          $owner = Get-CimInstance Win32_Process -Filter "ProcessId = $listenerId"
          if (-not $owner -or $owner.Name -ine 'python.exe' -or
              $owner.CommandLine -notmatch '(?i)\s-m\s+websockify(?:\s|$)') {
              throw 'The noVNC listener is not the expected Python websockify process.'
          }
          $currentId = $listenerId
          $verified = $false
          for ($depth = 0; $depth -lt 8; $depth++) {
              if ($currentId -eq $proxy.Id) { $verified = $true; break }
              $current = Get-CimInstance Win32_Process -Filter "ProcessId = $currentId"
              if (-not $current -or $current.ParentProcessId -eq 0 -or
                  $current.CreationDate -lt $proxy.StartTime.AddSeconds(-2)) { break }
              Write-Host "Proxy process chain: PID $currentId, parent $($current.ParentProcessId), name $($current.Name)"
              $currentId = [int]$current.ParentProcessId
          }
          $proxy.Refresh()
          if (-not $verified -or $proxy.HasExited) {
              throw 'The listener does not belong to the running proxy process tree; refusing to open the tunnel.'
          }
          $listenerId | Set-Content "$root\proxy-listener.pid"
          Write-Host 'noVNC loopback address and proxy process ownership verified.'

      - name: 5. Start Cloudflare Tunnel and Show URL
        timeout-minutes: 9
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $Env:WEB_DESKTOP_ROOT
          @'
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $tunnel = Start-Process "$root\cloudflared.exe" -ArgumentList @(
              '--no-autoupdate', 'tunnel', '--url', 'http://127.0.0.1:16080', '--protocol', 'http2',
              '--metrics', '127.0.0.1:16081', '--edge-ip-version', '4'
          ) -RedirectStandardOutput "$root\tunnel.out.log" -RedirectStandardError "$root\tunnel.err.log" -PassThru
          $tunnel.Id | Set-Content "$root\tunnel.pid"
          $tunnel.WaitForExit()
          "Tunnel exited at $(Get-Date -Format o), code $($tunnel.ExitCode)" | Add-Content "$root\tunnel.err.log"
          exit 1
          '@ | Set-Content "$root\run-tunnel.ps1" -Encoding utf8
          $action = New-ScheduledTaskAction -Execute (Get-Command pwsh.exe).Source -Argument "-NoProfile -NonInteractive -File `"$root\run-tunnel.ps1`"" -WorkingDirectory $root
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 6)
          Register-ScheduledTask -TaskName 'WebDesktopTunnel' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName 'WebDesktopTunnel'
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$root\tunnel.pid"); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path "$root\tunnel.pid")) { throw 'Scheduled tunnel did not start; see task diagnostics.' }
          $tunnel = Get-Process -Id ([int](Get-Content "$root\tunnel.pid"))
          $url = ''
          for ($i = 0; $i -lt 60; $i++) {
              $tunnel.Refresh()
              if ($tunnel.HasExited) { throw 'cloudflared exited before creating the tunnel.' }
              $log = Get-Content "$root\tunnel.err.log" -Raw -ErrorAction SilentlyContinue
              if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') {
                  $url = $Matches[0] + '/vnc.html?autoconnect=true&resize=scale&path=websockify'
                  break
              }
              Start-Sleep -Seconds 2
          }
          if (-not $url) { throw 'Cloudflare did not return a Quick Tunnel URL.' }
          Write-Host 'Quick Tunnel address allocated; waiting for an active connector and public HTTP access...'
          $ready = $false
          $deadline = (Get-Date).AddMinutes(5)
          $lastStatus = 'not checked'
          $attempt = 0
          $hostname = ([uri]$url).DnsSafeHost
          while ((Get-Date) -lt $deadline) {
              $attempt++
              $tunnel.Refresh()
              if ($tunnel.HasExited) { throw 'cloudflared exited while waiting for tunnel readiness.' }
              foreach ($name in @('proxy', 'proxy-listener')) {
                  $processId = [int](Get-Content "$root\$name.pid")
                  if (-not (Get-Process -Id $processId -ErrorAction SilentlyContinue)) {
                      throw "$name exited before the tunnel became ready. Check proxy.err.log."
                  }
              }
              # Local probes bypass proxies; verify the origin using the public Host header too.
              try {
                  $origin = Invoke-WebRequest 'http://127.0.0.1:16080/vnc.html' -Headers @{ Host = $hostname } -NoProxy -TimeoutSec 5 -SkipHttpErrorCheck
                  if ($origin.StatusCode -ne 200 -or $origin.Content -notmatch '(?i)noVNC') {
                      throw "Unexpected origin response: HTTP $($origin.StatusCode)"
                  }
              } catch {
                  throw "Local noVNC origin is unavailable: $($_.Exception.Message)"
              }
              try {
                  $connector = Invoke-WebRequest 'http://127.0.0.1:16081/ready' -NoProxy -TimeoutSec 5 -SkipHttpErrorCheck
                  if ($connector.StatusCode -eq 200) {
                      $public = Invoke-WebRequest $url -NoProxy -TimeoutSec 10 -SkipHttpErrorCheck
                      $lastStatus = "origin=200, connector=200, public=$($public.StatusCode)"
                      if ($public.StatusCode -eq 200 -and $public.Content -match '(?i)noVNC') {
                          $ready = $true
                          break
                      }
                      if ($public.StatusCode -eq 502 -and $attempt % 4 -eq 0) {
                          Write-Host 'Recent tunnel errors (origin HTTP is working locally):'
                          Get-Content "$root\tunnel.err.log" -Tail 15
                          Write-Host 'Recent WebSocket proxy logs:'
                          Get-Content "$root\proxy.err.log" -Tail 10
                      }
                  } else {
                      $lastStatus = "origin=200, connector readiness HTTP $($connector.StatusCode)"
                  }
              } catch {
                  $lastStatus = "origin=200, external probe error: $($_.Exception.Message)"
              }
              Write-Host "Waiting for tunnel: $lastStatus"
              if ($attempt % 6 -eq 0) {
                  foreach ($resolver in @('', '1.1.1.1')) {
                      $label = if ($resolver) { $resolver } else { 'system DNS' }
                      try {
                          $dnsParams = @{ Name = $hostname; Type = 'A'; DnsOnly = $true; ErrorAction = 'Stop' }
                          if ($resolver) { $dnsParams.Server = $resolver }
                          $addresses = Resolve-DnsName @dnsParams | Where-Object IPAddress | Select-Object -ExpandProperty IPAddress
                          Write-Host "DNS [$label]: $($addresses -join ', ')"
                      } catch {
                          Write-Host "DNS [$label]: $($_.Exception.Message)"
                      }
                  }
                  Clear-DnsClientCache
              }
              Start-Sleep -Seconds 5
          }
          if (-not $ready) {
              throw "Tunnel did not become reachable ($lastStatus). Check tunnel logs and outbound TCP 7844 connectivity."
          }
          Write-Host 'Cloudflare connector ready; public noVNC page verified (HTTP 200).'
          Write-Host "Desktop URL: $url"
          Write-Host 'VNC password: secret VNC_PASSWORD (not printed)'
          Write-Host 'If Windows is locked: use noVNC Ctrl-Alt-Del, then .\runneradmin / secret RDP_PASSWORD.'
          Write-Host 'HTTP page is public; the desktop is protected by VNC authentication. Do not share this URL.'
          @"
          ## Windows Web Desktop
          - [Open noVNC desktop]($url)
          - VNC password: your ``VNC_PASSWORD`` secret.
          - Windows login: ``.\runneradmin`` / your ``RDP_PASSWORD`` secret.
          - Allow a short delay for the tunnel to become reachable.
          - Classic VNC has an eight-character password limit. Temporary testing only; use Cloudflare Access for sensitive workloads.
          - All VM data is discarded when the job ends. Close the workflow to end access, not just the browser tab.
          "@ >> $Env:GITHUB_STEP_SUMMARY

      - name: 6. Keep Desktop Available
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $Env:WEB_DESKTOP_ROOT
          for ($i = 1; $i -le [int]$Env:DURATION_MINUTES; $i++) {
              Start-Sleep -Seconds 60
              if ((Get-Service tvnserver).Status -ne 'Running') { throw 'TightVNC stopped.' }
              foreach ($name in @('proxy', 'proxy-listener', 'tunnel')) {
                  $processId = [int](Get-Content "$root\$name.pid")
                  if (-not (Get-Process -Id $processId -ErrorAction SilentlyContinue)) { throw "$name stopped." }
              }
              try {
                  $connector = Invoke-WebRequest 'http://127.0.0.1:16081/ready' -TimeoutSec 5 -SkipHttpErrorCheck
                  if ($connector.StatusCode -ne 200) {
                      Write-Warning "Tunnel has no ready connector (HTTP $($connector.StatusCode)); cloudflared will retry."
                      Get-Content "$root\tunnel.err.log" -Tail 12
                  }
              } catch {
                  Write-Warning 'Tunnel readiness endpoint is unavailable; check the tunnel connection.'
              }
              Write-Host "[$i/$Env:DURATION_MINUTES] Desktop services running."
          }

      - name: Diagnostics on Failure
        if: failure()
        run: |
          foreach ($taskName in @('WebDesktopProxy', 'WebDesktopTunnel')) {
              $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if ($task) {
                  $task | Select-Object TaskName, State | Format-Table
                  Get-ScheduledTaskInfo -TaskName $taskName | Select-Object LastRunTime, LastTaskResult | Format-List
              }
          }
          foreach ($name in @('proxy.out.log', 'proxy.err.log', 'tunnel.err.log')) {
              $path = Join-Path $Env:WEB_DESKTOP_ROOT $name
              if (Test-Path $path) { Get-Content $path -Tail 40 }
          }

      - name: Stop Desktop Services
        if: always()
        timeout-minutes: 2
        run: |
          if ($Env:WEB_DESKTOP_ROOT) {
              foreach ($name in @('tunnel', 'proxy')) {
                  $path = Join-Path $Env:WEB_DESKTOP_ROOT "$name.pid"
                  if (Test-Path $path) {
                      $processId = [int](Get-Content $path)
                      taskkill.exe /PID $processId /T /F 2>$null | Out-Null
                  }
              }
          }
          foreach ($taskName in @('WebDesktopTunnel', 'WebDesktopProxy')) {
              if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
                  Stop-ScheduledTask -TaskName $taskName -ErrorAction Continue
                  Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
              }
          }
          $service = Get-Service tvnserver -ErrorAction SilentlyContinue
          if ($service) { Stop-Service tvnserver -Force }
          exit 0
